<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ATLAS DCS Explorer</title>
<link rel="icon" href="static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://unpkg.com/uplot@1.6.30/dist/uPlot.min.css">
<link rel="stylesheet" href="static/style.css">
<script src="https://unpkg.com/uplot@1.6.30/dist/uPlot.iife.min.js"></script>
</head>
<body>
<header>
  <h1>DCS EXPLORER</h1>
  <span class="stats" id="stats">-</span>
</header>

<div id="layout">
  <!-- ── Sidebar ─────────────────────────────────────────── -->
  <div id="sidebar">
    <div id="daterange">
      <div class="dr-row"><span class="dr-label">From</span><input type="datetime-local" id="dt0"></div>
      <div class="dr-row"><span class="dr-label">To</span><input type="datetime-local" id="dt1"></div>
      <button id="applyRange">Go</button>
      <button id="clearCache" class="secondary">Clear Cache</button>

      <div class="algo-row">
        <label>Downsample</label>
        <select id="algo">
          <option value="M4" selected>M4 (default)</option>
          <option value="LTTB">LTTB</option>
          <option value="MINMAXLTTB">MinMaxLTTB</option>
          <option value="RAW">Raw</option>
        </select>
      </div>

      <label class="toggle-row">
        <input type="checkbox" id="perAxis" checked>
        <span>Per-channel Y axes</span>
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="showScore">
        <span>SPOT score panel</span>
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="showHeatmap">
        <span>Channel heatmap</span>
      </label>
    </div>

    <input type="text" id="filter" placeholder="filter channels…">
    <div class="help">Check channels · set date range · click Go</div>
    <div id="chanlist"></div>
  </div>

  <!-- ── Main area ───────────────────────────────────────── -->
  <div id="main">
    <div class="legend" id="legend">Select channels + date range, then click Go</div>

    <!-- Primary chart -->
    <div id="chartwrap"><div id="chart"></div></div>

    <!-- SPOT score panel -->
    <div id="scorewrap" style="display:none">
      <div class="panel-label">SPOT Anomaly Score
        <span class="panel-hint">(score &gt; threshold → anomalous)</span>
      </div>
      <div id="scorechart"></div>
    </div>

    <!-- Cross-channel heatmap -->
    <div id="heatmapwrap" style="display:none">
      <div id="heatmap-resizer" title="Drag to resize heatmap · double-click to auto-size"></div>
      <div class="panel-label">Channel Heatmap
        <span class="panel-hint">(z-score · blue below · dark normal · red above)</span>
        <span class="hm-legend">
          <span class="hm-legend-label">z −3</span>
          <span class="hm-legend-bar"></span>
          <span class="hm-legend-label">z +3</span>
        </span>
      </div>
      <div id="heatmap-plot">
        <canvas id="heatmap"></canvas>
        <div id="heatmap-xaxis"></div>
        <div id="heatmap-yaxis"></div>
      </div>
      <div id="hm-tooltip"></div>
    </div>
  </div>
</div>

<div id="tooltip"></div>

<script type="module" src="static/app.js"></script>
</body>
</html>
