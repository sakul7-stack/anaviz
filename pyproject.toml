[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "anaviz"
version = "0.1.0"
description = "Dataset-independent time-series visualization and evidence layer"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "ATLAS DCS Viz Team"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "psycopg_pool>=3.2",
    "numpy>=1.26",
    "pandas>=2.0",
    "requests>=2.31",
    "scipy>=1.11",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "httpx>=0.27"]

# The HLT datasource is an independent package (pip install -e ./datasource).
# It intentionally has no extra here: the project must not depend on it.

[project.scripts]
anaviz = "server.__main__:main"

[tool.setuptools.packages.find]
include = ["server", "server.*"]

[tool.pytest.ini_options]
pythonpath = ["."]
