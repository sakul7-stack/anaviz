[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "anaviz"
version = "0.1.0"
description = "ATLAS DCS Explorer — large-scale time-series visualization with anomaly overlay"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "ATLAS DCS Viz Team"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "psycopg_pool>=3.2",
    "numpy>=1.26",
    "pandas>=2.0",
    "requests>=2.31",
    "scipy>=1.11",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
hlt = ["h5py>=3.9", "tables>=3.9"]
test = ["pytest>=7.0", "httpx>=0.27"]

[project.scripts]
anaviz = "server.__main__:main"

[tool.setuptools.packages.find]
include = ["server", "server.*"]
