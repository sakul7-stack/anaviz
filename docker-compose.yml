# anaviz — two fully independent containers with separate images
#
#   datasource  : anaviz-datasource image, built from ./datasource alone
#                 (its own Dockerfile, pyproject.toml, entrypoint). Contains
#                 ONLY the HLT datasource package (anaviz_datasource): real
#                 HLT data (TimescaleDB) + /archive/* API on :9000. DB exposed
#                 on host :5434 so host-side ingest can write it. Source of
#                 truth; never cleared by the app.
#   project     : anaviz-project image (docker/Dockerfile.project)
#                 Contains ONLY the generic viz app (server/, frontend/,
#                 configs/): the dataset-independent service on :8000 + its
#                 own generic cache DB (:5433). No HLT code anywhere in it.
#
# The two services do not share build contexts, images, or code. Nothing is
# preloaded: a user registers the datasource (or any API) in the app with a
# config.json; the project then talks to it only over HTTP.
services:
  datasource:
    build:
      context: ./datasource
      dockerfile: Dockerfile
    image: anaviz-datasource:latest
    container_name: anaviz-datasource
    command: ["uvicorn", "--app-dir", "/app", "anaviz_datasource.archive_server:app", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      POSTGRES_USER: dcs
      POSTGRES_PASSWORD: dcs
      POSTGRES_DB: dcs
      DCSVIZ_DB: postgresql://dcs:dcs@localhost:5432/dcs
    ports:
      - "9000:9000"
      - "5434:5432"
    volumes:
      - anaviz_datasource_pgdata:/var/lib/postgresql/data
      - ./datasource/schema.sql:/docker-entrypoint-initdb.d/002_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/archive/extent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  project:
    build:
      context: .
      dockerfile: docker/Dockerfile.project
    image: anaviz-project:latest
    container_name: anaviz-project
    command: ["uvicorn", "server.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      POSTGRES_USER: dcs
      POSTGRES_PASSWORD: dcs
      POSTGRES_DB: dcs
      DCSVIZ_DB: postgresql://dcs:dcs@localhost:5432/dcs
      DCSVIZ_ARCHIVE: http://datasource:9000
    depends_on:
      datasource:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "5433:5432"
    volumes:
      - anaviz_cache_pgdata:/var/lib/postgresql/data
      - ./db/cache_schema.sql:/docker-entrypoint-initdb.d/002_cache.sql:ro
      - ./configs:/app/configs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/datasets || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  anaviz_cache_pgdata:
  anaviz_datasource_pgdata:
